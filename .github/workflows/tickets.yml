name: Check IEM tickets
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'detect.js'
      - 'requirements.txt'
      - '.github/workflows/tickets.yml'

permissions:
  contents: read

concurrency:
  group: iem-ticket-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: iem-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: iem-state-
      - name: Install browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check tickets and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m unittest discover -v
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Required Telegram secrets are missing; monitor cannot run."
            exit 1
          fi
          python bot.py scheduled
      - name: Remember last delivered status
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: iem-state-${{ github.run_id }}-${{ github.run_attempt }}
